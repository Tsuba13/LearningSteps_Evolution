name: Security Gatekeeper Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
            fetch-depth: 0


      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      - name: Build Docker Image # build docker image - tag is commit sha
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }} .


      - name: Run Trivy Security Scan # push to ACR - block if critical issues are found
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # 5. Push to ACR
      # This step only runs if Step 4 (Trivy) succeeded.
      # On the 'vulnerable' branch, this step should naturally SKIP/CANCEL.
      - name: Push Image to ACR
        if: success()
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }}
          echo "Success! Image pushed to Azure."
