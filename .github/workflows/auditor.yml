name: Security Auditing Pipeline

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    
      - name: ACR authentication
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"


      - name: Run Trivy scan on all files # scan everything in the repo for known vulnerabilities in dependencies, leaked secrets, and terraform misconfigurations - block if critical issues are found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'


      - name: Build Docker Image # build docker image - tag is commit sha
        run: |
          docker build \
            -t ${{ vars.ACR_NAME }}.azurecr.io/learningsteps:${{ github.sha }} \
            -f api/Dockerfile \
            api/


      - name: Run Trivy scan on Docker image # push to ACR - block if critical issues are found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.ACR_NAME }}.azurecr.io/learningsteps:${{ github.sha }}'
          format: 'table'
          exit-code: '2'
          severity: 'HIGH,CRITICAL'


      - name: Push Image to ACR
        if: success()
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/learningsteps:${{ github.sha }}
          echo "Success! Image pushed to Azure."
